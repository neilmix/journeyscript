<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Journey Visualizer</title>
  <style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

.journey-viewport {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background: #f5f5f5;
}

.journey-container {
  position: relative;
}

.step {
  background: white;
  border: 2px solid #333;
  border-radius: 8px;
  padding: 20px;
  min-width: 200px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.step h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

.step p {
  margin: 0 0 15px 0;
  font-size: 14px;
  color: #666;
}

.step button {
  background: #007bff;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 8px;
  font-size: 14px;
}

.step button:hover {
  background: #0056b3;
}

.journey-step-highlight {
  animation: highlight 1s ease-in-out;
}

@keyframes highlight {
  0%, 100% { background: white; }
  50% { background: #fffacd; }
}

.journey-step-current {
  border-color: #007bff !important;
  border-width: 3px !important;
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3), 0 2px 8px rgba(0,0,0,0.1);
}
  </style>
</head>
<body>
  <div class="journey-viewport">
    <div class="journey-container">
      <div class="step" id="welcome" data-place="start">
        <h2>Welcome</h2>
        <p>This is the starting point of your journey.</p>
        <p><button data-dest="step-2">Get Started</button></p>
      </div>

      <div class="step" id="step-2">
        <h2>Step 2</h2>
        <p>You're making <strong>progress</strong>!</p>
        <p><button data-dest="complete">Continue</button> <button data-dest="welcome">Go Back</button></p>
      </div>

      <div class="step" id="complete">
        <h2>Complete</h2>
        <p>You've reached the end.</p>
        <p><button data-dest="welcome">Restart</button></p>
      </div>
    </div>
  </div>

  <!-- Load dependencies from CDN -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>

  <!-- Load Journey Visualizer from local build -->
  <script src="../dist/journey-visualizer.umd.js"></script>

  <!-- Initialize -->
  <script>
    const visualizer = new JourneyVisualizer.JourneyVisualizer('.journey-container');
    visualizer.init().then(() => {
      console.log('Journey initialized!');
      window.visualizer = visualizer; // Expose for testing
    });
  </script>
</body>
</html>
