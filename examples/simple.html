<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Journey Visualizer</title>
  <style>
/* examples/styles.css */
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

.journey-viewport {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background: #f5f5f5;
}

.journey-container {
  position: relative;
}

.step {
  background: white;
  border: 2px solid #333;
  border-radius: 8px;
  padding: 20px;
  min-width: 200px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.step h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

.step p {
  margin: 0 0 15px 0;
  font-size: 14px;
  color: #666;
}

.step button {
  background: #007bff;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 8px;
  font-size: 14px;
}

.step button:hover {
  background: #0056b3;
}

.step button:disabled {
  background: #cccccc;
  cursor: not-allowed;
}

.journey-step-highlight {
  animation: highlight 1s ease-in-out;
}

@keyframes highlight {
  0%, 100% { background: white; }
  50% { background: #fffacd; }
}

.journey-step-current {
  border-color: #007bff !important;
  border-width: 3px !important;
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3), 0 2px 8px rgba(0,0,0,0.1);
}

  </style>
</head>
<body>
  <div class="journey-viewport">
    <div class="journey-container">
      <div class="step" id="welcome" data-place="start">
        <h2>Welcome</h2>
        <p>This is the starting point of your journey.</p>
        <p><button data-dest="step-2">Get Started</button></p>
        
      </div>

      <div class="step" id="step-2">
        <h2>Step 2</h2>
        <p>You're making <strong>progress</strong>!</p>
        <p><button data-dest="complete">Continue</button> <button data-dest="welcome">Go Back</button></p>
        
      </div>

      <div class="step" id="complete">
        <h2>Complete</h2>
        <p>You've reached the end.</p>
        <p><button data-dest="welcome">Restart</button></p>
        
      </div>
    </div>
  </div>

  <!-- Load dependencies from CDN -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <!-- Inlined journey visualizer -->
  <script>
(function (global, factory) {
  typeof exports === 'object' && typeof module !== 'undefined' ? factory(exports, require('dagre')) :
  typeof define === 'function' && define.amd ? define(['exports', 'dagre'], factory) :
  (global = typeof globalThis !== 'undefined' ? globalThis : global || self, factory(global.JourneyVisualizer = {}, global.dagre));
})(this, (function (exports, dagre) { 'use strict';

  // src/ZoomPanController.js

  /**
   * ZoomPanController: Clean, custom zoom and pan implementation
   *
   * Handles:
   * - Wheel-based zooming with focal point
   * - Drag panning with pointer events
   * - Programmatic zoom/pan API
   *
   * Does NOT handle:
   * - Pinch zoom (not needed for this project)
   * - Containment (we need free positioning)
   */
  class ZoomPanController {
    constructor(element, viewport, options = {}) {
      this.element = element;
      this.viewport = viewport;

      // Options
      this.minScale = options.minScale || 0.1;
      this.maxScale = options.maxScale || 3;
      this.zoomStep = options.step || 0.1;

      // Transform state - single source of truth
      this.scale = 1;
      this.translateX = 0;
      this.translateY = 0;

      // Drag state
      this.isDragging = false;
      this.dragStartX = 0;
      this.dragStartY = 0;
      this.dragStartTranslateX = 0;
      this.dragStartTranslateY = 0;

      // Bind event handlers
      this._handleWheel = this._handleWheel.bind(this);
      this._handlePointerDown = this._handlePointerDown.bind(this);
      this._handlePointerMove = this._handlePointerMove.bind(this);
      this._handlePointerUp = this._handlePointerUp.bind(this);

      // Set transform origin to top-left so our math works correctly
      this.element.style.transformOrigin = '0 0';

      // Initialize
      this._attachEventListeners();
      this._applyTransform();
    }

    _attachEventListeners() {
      // Wheel zoom on viewport with capture to ensure we handle it first
      this.viewport.addEventListener('wheel', this._handleWheel, {
        passive: false,
        capture: true
      });

      // Drag panning on element
      this.element.addEventListener('pointerdown', this._handlePointerDown);
      // Move and up on document to handle drag outside element
      document.addEventListener('pointermove', this._handlePointerMove);
      document.addEventListener('pointerup', this._handlePointerUp);
    }

    _handleWheel(event) {
      event.preventDefault();
      event.stopPropagation();

      // Calculate scale change
      const delta = -event.deltaY;
      const scaleChange = delta > 0 ? this.zoomStep : -this.zoomStep;
      const newScale = Math.max(
        this.minScale,
        Math.min(this.maxScale, this.scale + scaleChange)
      );

      // If scale didn't change (hit min/max), do nothing
      if (newScale === this.scale) return;

      // Get focal point in viewport coordinates
      const viewportRect = this.viewport.getBoundingClientRect();
      const focalX = event.clientX - viewportRect.left;
      const focalY = event.clientY - viewportRect.top;

      // Calculate the container point at the focal position
      // Transform from viewport coords to container coords
      const containerX = (focalX - this.translateX) / this.scale;
      const containerY = (focalY - this.translateY) / this.scale;

      // Calculate new translation to keep that point at the focal position
      const newTranslateX = focalX - containerX * newScale;
      const newTranslateY = focalY - containerY * newScale;

      // Update state and apply
      this.scale = newScale;
      this.translateX = newTranslateX;
      this.translateY = newTranslateY;
      this._applyTransform();

      // Dispatch change event
      this._dispatchChangeEvent();
    }

    _handlePointerDown(event) {
      // Only handle primary button (left click / touch)
      if (event.button !== 0) return;

      // Don't interfere with interactive elements
      const target = event.target;
      if (this._isInteractiveElement(target)) {
        return;
      }

      // Start dragging
      this.isDragging = true;
      this.dragStartX = event.clientX;
      this.dragStartY = event.clientY;
      this.dragStartTranslateX = this.translateX;
      this.dragStartTranslateY = this.translateY;

      // Prevent text selection during drag
      event.preventDefault();

      // Change cursor
      this.element.style.cursor = 'grabbing';
    }

    _isInteractiveElement(element) {
      // Check if element is a form control or other interactive element
      if (element.matches) {
        return element.matches('select, input, textarea, button, a, [contenteditable], [data-dest]');
      }
      return false;
    }

    _handlePointerMove(event) {
      if (!this.isDragging) return;

      // Calculate delta from drag start
      const deltaX = event.clientX - this.dragStartX;
      const deltaY = event.clientY - this.dragStartY;

      // Update translation
      this.translateX = this.dragStartTranslateX + deltaX;
      this.translateY = this.dragStartTranslateY + deltaY;
      this._applyTransform();

      // Dispatch change event
      this._dispatchChangeEvent();
    }

    _handlePointerUp(event) {
      if (!this.isDragging) return;

      this.isDragging = false;
      this.element.style.cursor = 'grab';
    }

    _applyTransform(animate = false) {
      if (animate) {
        this.element.style.transition = 'transform 0.3s ease-in-out';
      }

      this.element.style.transform =
        `matrix(${this.scale}, 0, 0, ${this.scale}, ${this.translateX}, ${this.translateY})`;

      if (animate) {
        // Remove transition after animation completes
        setTimeout(() => {
          this.element.style.transition = '';
        }, 300);
      }
    }

    _dispatchChangeEvent() {
      const event = new CustomEvent('transformchange', {
        detail: {
          scale: this.scale,
          x: this.translateX,
          y: this.translateY
        }
      });
      this.element.dispatchEvent(event);
    }

    // Public API

    /**
     * Get current transform state
     */
    getScale() {
      return this.scale;
    }

    getPan() {
      return { x: this.translateX, y: this.translateY };
    }

    /**
     * Set zoom level
     * @param {number} scale - Target scale
     * @param {Object} options - Options
     * @param {boolean} options.animate - Whether to animate
     * @param {Object} options.focal - Focal point {x, y} in viewport coordinates
     */
    zoom(scale, options = {}) {
      const newScale = Math.max(this.minScale, Math.min(this.maxScale, scale));

      if (options.focal) {
        // Zoom to focal point
        const containerX = (options.focal.x - this.translateX) / this.scale;
        const containerY = (options.focal.y - this.translateY) / this.scale;

        this.translateX = options.focal.x - containerX * newScale;
        this.translateY = options.focal.y - containerY * newScale;
      }

      this.scale = newScale;
      this._applyTransform(options.animate);
      this._dispatchChangeEvent();
    }

    /**
     * Set pan position
     * @param {number} x - X translation
     * @param {number} y - Y translation
     * @param {Object} options - Options
     * @param {boolean} options.animate - Whether to animate
     */
    pan(x, y, options = {}) {
      this.translateX = x;
      this.translateY = y;
      this._applyTransform(options.animate);
      this._dispatchChangeEvent();
    }

    /**
     * Clean up event listeners
     */
    destroy() {
      this.viewport.removeEventListener('wheel', this._handleWheel, { capture: true });
      this.element.removeEventListener('pointerdown', this._handlePointerDown);
      document.removeEventListener('pointermove', this._handlePointerMove);
      document.removeEventListener('pointerup', this._handlePointerUp);
    }
  }

  // src/LaneAnalyzer.js

  /**
   * LaneAnalyzer: Analyzes a graph to determine if it's compatible with lane-based layout.
   *
   * Lane-compatible means: when a graph branches, those branches stay isolated
   * until they merge at a common descendant. No cross-branch edges are allowed
   * (except to merge points).
   */
  class LaneAnalyzer {
    constructor(nodes, edges) {
      // nodes: Map<nodeId, { outEdges: string[], inEdges: string[] }>
      // edges: Array<{ from: string, to: string }>
      this.nodes = nodes;
      this.edges = edges;
    }

    /**
     * Create a LaneAnalyzer from a dagre graph
     */
    static fromDagreGraph(graph) {
      const nodes = new Map();
      const edges = [];

      // Extract nodes
      graph.nodes().forEach(nodeId => {
        nodes.set(nodeId, { id: nodeId, outEdges: [], inEdges: [] });
      });

      // Extract edges
      graph.edges().forEach(edgeObj => {
        const from = edgeObj.v;
        const to = edgeObj.w;
        edges.push({ from, to });

        if (nodes.has(from)) {
          nodes.get(from).outEdges.push(to);
        }
        if (nodes.has(to)) {
          nodes.get(to).inEdges.push(from);
        }
      });

      return new LaneAnalyzer(nodes, edges);
    }

    /**
     * Find the start node (node with no incoming edges, or first node)
     */
    findStartNode() {
      for (const [id, node] of this.nodes) {
        if (node.inEdges.length === 0) return id;
      }
      // Fallback: first node
      return this.nodes.keys().next().value;
    }

    /**
     * Build a branch tree using BFS.
     * When we hit a node with multiple outgoing edges, each child starts a new branch.
     */
    buildBranchTree(startId) {
      const branchOf = new Map();      // nodeId -> branchId
      const branchParent = new Map();  // branchId -> parent branchId
      const branchRoot = new Map();    // branchId -> root nodeId of that branch
      const branchNodes = new Map();   // branchId -> Set of nodeIds in that branch

      let nextBranchId = 0;
      const mainBranch = nextBranchId++;
      branchNodes.set(mainBranch, new Set());

      const visited = new Set();
      const queue = [{ nodeId: startId, branchId: mainBranch }];

      while (queue.length > 0) {
        const { nodeId, branchId } = queue.shift();

        if (visited.has(nodeId)) continue;
        visited.add(nodeId);

        branchOf.set(nodeId, branchId);
        branchNodes.get(branchId).add(nodeId);

        const node = this.nodes.get(nodeId);
        if (!node) continue;

        const outEdges = [...new Set(node.outEdges)]; // Dedupe

        if (outEdges.length > 1) {
          // This is a branch point - each child starts a new branch
          for (const childId of outEdges) {
            if (!visited.has(childId)) {
              const childBranch = nextBranchId++;
              branchParent.set(childBranch, branchId);
              branchRoot.set(childBranch, childId);
              branchNodes.set(childBranch, new Set());
              queue.push({ nodeId: childId, branchId: childBranch });
            }
          }
        } else if (outEdges.length === 1) {
          const childId = outEdges[0];
          if (!visited.has(childId)) {
            queue.push({ nodeId: childId, branchId });
          }
        }
      }

      return { branchOf, branchParent, branchRoot, branchNodes };
    }

    /**
     * Identify merge points - nodes with multiple incoming edges from different branches
     */
    findMergePoints(branchOf) {
      const mergePoints = new Map();  // nodeId -> Set of source branches

      for (const [id, node] of this.nodes) {
        if (node.inEdges.length > 1) {
          const sourceBranches = new Set();
          for (const srcId of node.inEdges) {
            if (branchOf.has(srcId)) {
              sourceBranches.add(branchOf.get(srcId));
            }
          }
          if (sourceBranches.size > 1) {
            mergePoints.set(id, sourceBranches);
          }
        }
      }

      return mergePoints;
    }

    /**
     * Get the ancestry of a branch (all parent branches)
     */
    getBranchAncestry(branchId, branchParent) {
      const ancestry = new Set([branchId]);
      let current = branchId;
      while (branchParent.has(current)) {
        current = branchParent.get(current);
        ancestry.add(current);
      }
      return ancestry;
    }

    /**
     * Check if potentialAncestor is an ancestor branch of branch
     */
    isAncestorBranch(potentialAncestor, branch, branchParent) {
      let current = branch;
      while (branchParent.has(current)) {
        current = branchParent.get(current);
        if (current === potentialAncestor) return true;
      }
      return false;
    }

    /**
     * Find the common ancestor branch of two branches
     */
    findCommonAncestor(branch1, branch2, branchParent) {
      const ancestry1 = this.getBranchAncestry(branch1, branchParent);
      let current = branch2;
      while (current !== undefined) {
        if (ancestry1.has(current)) return current;
        current = branchParent.get(current);
      }
      return undefined;
    }

    /**
     * Find cross-branch violations.
     * A violation is when branch A connects to an internal node of branch B
     * (not a merge point).
     */
    findViolations(branchOf, branchParent, mergePoints) {
      const violations = [];

      for (const edge of this.edges) {
        const srcBranch = branchOf.get(edge.from);
        const dstBranch = branchOf.get(edge.to);

        if (srcBranch === undefined || dstBranch === undefined) continue;
        if (srcBranch === dstBranch) continue;  // Same branch, OK

        // Case 1: Going to an ancestor branch (back-edge to trunk) - OK
        if (this.isAncestorBranch(dstBranch, srcBranch, branchParent)) {
          continue;
        }

        // Case 2: Going to a merge point - OK
        if (mergePoints.has(edge.to)) {
          continue;
        }

        // Case 3: Sibling branches, target is not a merge point = VIOLATION
        const commonAncestor = this.findCommonAncestor(srcBranch, dstBranch, branchParent);
        if (commonAncestor !== undefined) {
          if (commonAncestor !== srcBranch && commonAncestor !== dstBranch) {
            violations.push({
              from: edge.from,
              to: edge.to,
              srcBranch,
              dstBranch,
              commonAncestor,
              message: `Cross-branch edge: ${edge.from} (branch ${srcBranch}) → ${edge.to} (branch ${dstBranch})`
            });
          }
        }
      }

      return violations;
    }

    /**
     * Identify back-edges (edges that go to an already-visited node during DFS)
     * These are cycles in the graph.
     */
    findBackEdges(startId) {
      const backEdges = [];
      const visited = new Set();
      const inStack = new Set();

      const dfs = (nodeId) => {
        if (inStack.has(nodeId)) {
          return; // Already in current path
        }
        if (visited.has(nodeId)) {
          return; // Already fully processed
        }

        visited.add(nodeId);
        inStack.add(nodeId);

        const node = this.nodes.get(nodeId);
        if (node) {
          for (const childId of node.outEdges) {
            if (inStack.has(childId)) {
              // Back-edge: going to a node in current path
              backEdges.push({ from: nodeId, to: childId });
            } else if (!visited.has(childId)) {
              dfs(childId);
            } else {
              // Cross-edge or forward-edge to already-visited node
              // This is also a "back-edge" in terms of layout (goes to earlier node)
              backEdges.push({ from: nodeId, to: childId });
            }
          }
        }

        inStack.delete(nodeId);
      };

      dfs(startId);
      return backEdges;
    }

    /**
     * Perform full analysis and return results
     */
    analyze() {
      const startId = this.findStartNode();
      const { branchOf, branchParent, branchRoot, branchNodes } = this.buildBranchTree(startId);
      const mergePoints = this.findMergePoints(branchOf);
      const violations = this.findViolations(branchOf, branchParent, mergePoints);
      const backEdges = this.findBackEdges(startId);

      const isLaneCompatible = violations.length === 0;

      return {
        startId,
        branchOf,
        branchParent,
        branchRoot,
        branchNodes,
        mergePoints,
        violations,
        backEdges,
        isLaneCompatible,
        stats: {
          nodeCount: this.nodes.size,
          edgeCount: this.edges.length,
          branchCount: branchNodes.size,
          mergePointCount: mergePoints.size,
          backEdgeCount: backEdges.length,
          violationCount: violations.length
        }
      };
    }
  }

  // src/LaneLayout.js

  /**
   * LaneLayout: Computes positions for nodes using a lane-based layout algorithm
   * with per-rank compaction.
   *
   * The algorithm:
   * 1. Build a tree structure from the graph (ignoring back-edges)
   * 2. Assign ranks (vertical position based on distance from start)
   * 3. Calculate x positions using per-rank compaction:
   *    - Siblings are placed just beyond the width of preceding subtrees at their rank
   *    - This allows shallow siblings to be compact even if deep siblings expand
   * 4. Compute edge paths, including wrapped paths for back-edges
   */
  class LaneLayout {
    constructor(graph, analysis, options = {}) {
      this.graph = graph;  // dagre graphlib Graph
      this.analysis = analysis;  // Result from LaneAnalyzer.analyze()
      this.options = {
        rankSep: options.rankSep || 120,  // Vertical spacing between ranks
        nodeSep: options.nodeSep || 80,   // Horizontal spacing between nodes
        marginX: options.marginX || 50,   // Left margin
        marginY: options.marginY || 50,   // Top margin
        backEdgeOffset: options.backEdgeOffset || 80,  // How far back-edges extend outside
        ...options
      };

      // Layout state
      this.nodePositions = new Map();  // nodeId -> { x, y, width, height, rank }
      this.edgePaths = new Map();      // "from->to" -> { points: [{x,y}...], isBackEdge: bool }
      this.rankHeights = new Map();    // rank -> max height of nodes in that rank
      this.rankYPositions = new Map(); // rank -> y position (top edge of rank)

      // Tree structure for layout
      this.children = new Map();       // nodeId -> [childIds] (in layout order)
      this.parent = new Map();         // nodeId -> parentId
    }

    /**
     * Main layout computation
     */
    compute() {
      // Step 1: Build tree structure from graph
      this.buildTree();

      // Step 2: Assign ranks (vertical position) using tree depth
      this.assignRanks();

      // Step 3: Store node dimensions
      this.storeDimensions();

      // Step 4: Calculate rank heights and y positions
      this.calculateRankPositions();

      // Step 5: Calculate x positions using per-rank compaction
      this.calculateXPositions();

      // Step 6: Route edges
      this.routeEdges();

      return {
        nodePositions: this.nodePositions,
        edgePaths: this.edgePaths,
        bounds: this.calculateBounds()
      };
    }

    /**
     * Build a tree structure from the graph, ignoring back-edges.
     * Each node has at most one parent in the tree.
     */
    buildTree() {
      const { startId, backEdges } = this.analysis;
      const backEdgeSet = new Set(backEdges.map(e => `${e.from}->${e.to}`));

      // Initialize
      this.graph.nodes().forEach(nodeId => {
        this.children.set(nodeId, []);
      });

      const visited = new Set();
      const queue = [startId];
      visited.add(startId);

      while (queue.length > 0) {
        const nodeId = queue.shift();
        const successors = this.graph.successors(nodeId) || [];

        for (const childId of successors) {
          const edgeKey = `${nodeId}->${childId}`;

          // Skip back-edges and already-visited nodes
          if (backEdgeSet.has(edgeKey)) continue;
          if (visited.has(childId)) continue;

          visited.add(childId);
          this.children.get(nodeId).push(childId);
          this.parent.set(childId, nodeId);
          queue.push(childId);
        }
      }
    }

    /**
     * Assign ranks using tree depth (BFS from root)
     */
    assignRanks() {
      const { startId } = this.analysis;

      const queue = [{ nodeId: startId, rank: 0 }];
      const visited = new Set();

      while (queue.length > 0) {
        const { nodeId, rank } = queue.shift();

        if (visited.has(nodeId)) continue;
        visited.add(nodeId);

        if (!this.nodePositions.has(nodeId)) {
          this.nodePositions.set(nodeId, {});
        }
        this.nodePositions.get(nodeId).rank = rank;

        const children = this.children.get(nodeId) || [];
        for (const childId of children) {
          if (!visited.has(childId)) {
            queue.push({ nodeId: childId, rank: rank + 1 });
          }
        }
      }

      // Handle any unvisited nodes
      this.graph.nodes().forEach(nodeId => {
        if (!this.nodePositions.has(nodeId)) {
          this.nodePositions.set(nodeId, { rank: 0 });
        }
      });
    }

    /**
     * Store node dimensions from the graph
     */
    storeDimensions() {
      this.graph.nodes().forEach(nodeId => {
        const node = this.graph.node(nodeId);
        if (node && this.nodePositions.has(nodeId)) {
          const pos = this.nodePositions.get(nodeId);
          pos.width = node.width || 200;
          pos.height = node.height || 100;
        }
      });
    }

    /**
     * Calculate rank heights and y positions
     */
    calculateRankPositions() {
      const { marginY, rankSep } = this.options;

      // Calculate max height per rank
      for (const [nodeId, pos] of this.nodePositions) {
        const { rank, height } = pos;
        if (rank !== undefined && height !== undefined) {
          const currentMax = this.rankHeights.get(rank) || 0;
          this.rankHeights.set(rank, Math.max(currentMax, height));
        }
      }

      // Calculate cumulative y positions
      let currentY = marginY;
      const sortedRanks = [...this.rankHeights.keys()].sort((a, b) => a - b);
      for (const rank of sortedRanks) {
        this.rankYPositions.set(rank, currentY);
        currentY += this.rankHeights.get(rank) + rankSep;
      }

      // Assign y positions to nodes
      for (const [nodeId, pos] of this.nodePositions) {
        const { rank, height } = pos;
        if (rank === undefined) continue;

        const rankY = this.rankYPositions.get(rank) || marginY;
        const rankHeight = this.rankHeights.get(rank) || height;
        pos.y = rankY + rankHeight / 2;
      }
    }

    /**
     * Calculate x positions using per-rank compaction.
     *
     * Key insight: When placing a child, we only need to avoid overlap
     * at ranks where BOTH the child's subtree AND previous siblings' subtrees
     * have nodes. For leaf nodes (no children), this means only checking
     * the leaf's own rank, allowing them to be placed compactly.
     */
    calculateXPositions() {
      const { startId } = this.analysis;
      const { marginX, nodeSep } = this.options;

      // First pass: calculate subtree depth ranges for each node
      // This tells us which ranks each subtree spans
      const subtreeRanges = new Map(); // nodeId -> { minRank, maxRank }

      const calculateRanges = (nodeId) => {
        const pos = this.nodePositions.get(nodeId);
        if (!pos) return { minRank: 0, maxRank: 0 };

        const children = this.children.get(nodeId) || [];
        let minRank = pos.rank;
        let maxRank = pos.rank;

        for (const childId of children) {
          const childRange = calculateRanges(childId);
          minRank = Math.min(minRank, childRange.minRank);
          maxRank = Math.max(maxRank, childRange.maxRank);
        }

        subtreeRanges.set(nodeId, { minRank, maxRank });
        return { minRank, maxRank };
      };

      calculateRanges(startId);

      // Second pass: calculate positions using per-rank extent
      // For each subtree, track the rightmost x at each rank
      const calculateSubtreeExtent = (nodeId, leftX) => {
        const pos = this.nodePositions.get(nodeId);
        if (!pos) return new Map();

        const rank = pos.rank;
        const width = pos.width;
        const children = this.children.get(nodeId) || [];

        // This node's center x and right edge
        const nodeX = leftX + width / 2;
        pos.x = nodeX;
        const rightX = leftX + width;

        // Track the rightmost edge at each rank in this subtree
        const extent = new Map();
        extent.set(rank, rightX);

        if (children.length === 0) {
          // Leaf node - extent is just this node
          return extent;
        }

        // Process children left-to-right
        let childLeftX = leftX; // First child aligns with parent's left edge

        for (let i = 0; i < children.length; i++) {
          const childId = children[i];
          const childPos = this.nodePositions.get(childId);
          if (!childPos) continue;

          const childRange = subtreeRanges.get(childId);

          // For subsequent children, find minimum x that avoids overlap
          // Only check ranks that BOTH this child's subtree AND previous siblings span
          if (i > 0 && childRange) {
            let maxExtent = leftX;

            for (let j = 0; j < i; j++) {
              const prevChildId = children[j];
              const prevExtent = this.subtreeExtents.get(prevChildId);
              const prevRange = subtreeRanges.get(prevChildId);

              if (prevExtent && prevRange) {
                // Find overlapping rank range
                const overlapMin = Math.max(childRange.minRank, prevRange.minRank);
                const overlapMax = Math.min(childRange.maxRank, prevRange.maxRank);

                // Check extent at each overlapping rank
                for (let r = overlapMin; r <= overlapMax; r++) {
                  if (prevExtent.has(r)) {
                    maxExtent = Math.max(maxExtent, prevExtent.get(r));
                  }
                }
              }
            }

            childLeftX = maxExtent + nodeSep;
          }

          // Recursively calculate child's subtree extent
          const childExtent = calculateSubtreeExtent(childId, childLeftX);
          this.subtreeExtents.set(childId, childExtent);

          // Merge child extent into this node's extent
          for (const [r, x] of childExtent) {
            const currentMax = extent.get(r) || 0;
            extent.set(r, Math.max(currentMax, x));
          }
        }

        return extent;
      };

      // Store subtree extents for each node
      this.subtreeExtents = new Map();

      // Calculate positions starting from root
      const rootExtent = calculateSubtreeExtent(startId, marginX);
      this.subtreeExtents.set(startId, rootExtent);
    }

    /**
     * Route edges between nodes
     */
    routeEdges() {
      const { backEdges } = this.analysis;
      const backEdgeSet = new Set(backEdges.map(e => `${e.from}->${e.to}`));

      this.graph.edges().forEach(edgeObj => {
        const from = edgeObj.v;
        const to = edgeObj.w;
        const edgeKey = `${from}->${to}`;

        const fromPos = this.nodePositions.get(from);
        const toPos = this.nodePositions.get(to);

        if (!fromPos || !toPos) return;

        const isBackEdge = backEdgeSet.has(edgeKey);

        if (isBackEdge) {
          this.routeBackEdge(from, to, fromPos, toPos, edgeKey);
        } else {
          this.routeNormalEdge(from, to, fromPos, toPos, edgeKey);
        }
      });
    }

    /**
     * Route a normal (forward) edge
     */
    routeNormalEdge(from, to, fromPos, toPos, edgeKey) {
      const fromBottom = fromPos.y + fromPos.height / 2;
      const toTop = toPos.y - toPos.height / 2;

      // Simple routing: exit from bottom center, enter at top center
      const points = [
        { x: fromPos.x, y: fromBottom },
        { x: toPos.x, y: toTop }
      ];

      // If x positions are different, add bend points
      if (Math.abs(fromPos.x - toPos.x) > 1) {
        const midY = (fromBottom + toTop) / 2;
        points.splice(1, 0,
          { x: fromPos.x, y: midY },
          { x: toPos.x, y: midY }
        );
      }

      this.edgePaths.set(edgeKey, {
        points,
        isBackEdge: false,
        label: this.graph.edge({ v: from, w: to })?.label
      });
    }

    /**
     * Route a back-edge (cycle) around the outside
     */
    routeBackEdge(from, to, fromPos, toPos, edgeKey) {
      const { backEdgeOffset } = this.options;

      // Determine which side to route around (right side)
      const maxX = Math.max(...[...this.nodePositions.values()].map(p => p.x + p.width / 2));
      const routeX = maxX + backEdgeOffset;

      const fromRight = fromPos.x + fromPos.width / 2;
      const fromY = fromPos.y;
      const toRight = toPos.x + toPos.width / 2;
      const toY = toPos.y;

      // Route: right from source, up/down along the side, left to target
      const points = [
        { x: fromRight, y: fromY },
        { x: routeX, y: fromY },
        { x: routeX, y: toY },
        { x: toRight, y: toY }
      ];

      this.edgePaths.set(edgeKey, {
        points,
        isBackEdge: true,
        label: this.graph.edge({ v: from, w: to })?.label
      });
    }

    /**
     * Calculate the bounds of the entire layout
     */
    calculateBounds() {
      let minX = Infinity, minY = Infinity;
      let maxX = -Infinity, maxY = -Infinity;

      for (const [nodeId, pos] of this.nodePositions) {
        if (pos.x === undefined || pos.y === undefined) continue;

        const left = pos.x - pos.width / 2;
        const right = pos.x + pos.width / 2;
        const top = pos.y - pos.height / 2;
        const bottom = pos.y + pos.height / 2;

        minX = Math.min(minX, left);
        minY = Math.min(minY, top);
        maxX = Math.max(maxX, right);
        maxY = Math.max(maxY, bottom);
      }

      // Account for back-edge routing
      const backEdgeMaxX = maxX + this.options.backEdgeOffset;

      return {
        minX: minX - this.options.marginX,
        minY: minY - this.options.marginY,
        maxX: Math.max(maxX, backEdgeMaxX) + this.options.marginX,
        maxY: maxY + this.options.marginY,
        width: Math.max(maxX, backEdgeMaxX) - minX + this.options.marginX * 2,
        height: maxY - minY + this.options.marginY * 2
      };
    }

    /**
     * Apply the computed layout to the dagre graph (for compatibility)
     */
    applyToGraph() {
      // Update node positions in the dagre graph
      for (const [nodeId, pos] of this.nodePositions) {
        const node = this.graph.node(nodeId);
        if (node) {
          node.x = pos.x;
          node.y = pos.y;
        }
      }

      // Update edge points in the dagre graph
      this.graph.edges().forEach(edgeObj => {
        const edgeKey = `${edgeObj.v}->${edgeObj.w}`;
        const pathData = this.edgePaths.get(edgeKey);
        const edge = this.graph.edge(edgeObj);

        if (edge && pathData) {
          edge.points = pathData.points;
          edge.isBackEdge = pathData.isBackEdge;
        }
      });
    }
  }

  // src/JourneyVisualizer.js

  class JourneyVisualizer {
    constructor(containerSelector, options = {}) {
      this.container = document.querySelector(containerSelector);

      if (!this.container) {
        throw new Error(`Container not found: ${containerSelector}`);
      }

      this.options = this._mergeOptions(options);
      this.steps = [];
      this.graph = null;
      this.zoomPanController = null;
    }

    _mergeOptions(userOptions) {
      const defaults = {
        layout: {
          direction: 'TB',
          rankSep: 120,
          nodeSep: 150,
          edgeSep: 50,
          align: 'DL',
          ranker: 'tight-tree'
        },
        zoom: {
          initial: 1,
          min: 0.1,
          max: 3,
          step: 0.03
        },
        arrows: {
          showLabels: true,
          color: '#333',
          width: 2
        },
        navigation: {
          animationDuration: 300,
          highlightOnNavigate: true
        }
      };

      return {
        layout: { ...defaults.layout, ...userOptions.layout },
        zoom: { ...defaults.zoom, ...userOptions.zoom },
        arrows: { ...defaults.arrows, ...userOptions.arrows },
        navigation: { ...defaults.navigation, ...userOptions.navigation }
      };
    }

    _discoverSteps() {
      const stepElements = this.container.querySelectorAll('.step');
      const stepIds = new Set();

      stepElements.forEach(stepElement => {
        // Validate ID exists
        if (!stepElement.id) {
          console.warn(`Step missing ID: ${stepElement.outerHTML.substring(0, 50)}...`);
          return;
        }

        // Validate ID is unique
        if (stepIds.has(stepElement.id)) {
          console.warn(`Duplicate step ID: ${stepElement.id}`);
          return;
        }

        stepIds.add(stepElement.id);
        this.steps.push(stepElement);
      });

      if (this.steps.length === 0) {
        throw new Error('No steps found with class="step"');
      }
    }

    _buildGraph() {
      this.graph = new dagre.graphlib.Graph();

      // Configure graph layout
      this.graph.setGraph({
        rankdir: this.options.layout.direction,
        ranksep: this.options.layout.rankSep,
        nodesep: this.options.layout.nodeSep,
        edgesep: this.options.layout.edgeSep,
        align: this.options.layout.align,
        ranker: this.options.layout.ranker
      });

      // Set position:absolute on steps BEFORE measuring to get accurate dimensions
      this.steps.forEach(step => {
        step.style.position = 'absolute';
      });

      // Add nodes with accurate measurements
      this.steps.forEach(step => {
        const rect = step.getBoundingClientRect();

        this.graph.setNode(step.id, {
          width: rect.width || 200,  // Default width if not rendered
          height: rect.height || 100, // Default height if not rendered
          element: step
        });
      });

      // Add edges
      const validStepIds = new Set(this.steps.map(s => s.id));

      this.steps.forEach(step => {
        const actions = step.querySelectorAll('[data-dest]');

        actions.forEach(action => {
          const destId = action.getAttribute('data-dest');
          const label = action.textContent.trim();

          // Validate destination exists
          if (!validStepIds.has(destId)) {
            console.warn(`Invalid destination: ${step.id} -> ${destId}`);
            return;
          }

          this.graph.setEdge(step.id, destId, {
            label: label,
            sourceElement: action
          });
        });
      });
    }

    _computeLayout() {
      // Analyze the graph for lane-compatibility
      const analyzer = LaneAnalyzer.fromDagreGraph(this.graph);
      const analysis = analyzer.analyze();

      this.layoutAlgorithm = 'dagre'; // Default

      if (analysis.isLaneCompatible) {
        // Use lane-based layout
        console.time('lane-layout');
        try {
          const laneLayout = new LaneLayout(this.graph, analysis, {
            rankSep: this.options.layout.rankSep,
            nodeSep: this.options.layout.nodeSep
          });
          laneLayout.compute();
          laneLayout.applyToGraph();
          this.layoutAlgorithm = 'lane';
          this.laneAnalysis = analysis;
          console.timeEnd('lane-layout');
          console.log(`Lane layout: ${analysis.stats.branchCount} branches, ${analysis.stats.backEdgeCount} back-edges`);
        } catch (error) {
          console.warn('Lane layout failed, falling back to dagre:', error);
          console.time('dagre-layout');
          dagre.layout(this.graph);
          console.timeEnd('dagre-layout');
        }
      } else {
        // Use dagre for non-lane-compatible graphs
        console.time('dagre-layout');
        dagre.layout(this.graph);
        console.timeEnd('dagre-layout');
        console.log(`Dagre layout: ${analysis.stats.violationCount} lane violations detected`);
      }
    }

    _positionSteps() {
      let minX = Infinity, minY = Infinity;
      let maxX = -Infinity, maxY = -Infinity;

      // First pass: track bounds
      const positions = new Map();
      this.graph.nodes().forEach(nodeId => {
        const node = this.graph.node(nodeId);

        // Dagre gives center coordinates, convert to top-left
        const x = node.x - node.width / 2;
        const y = node.y - node.height / 2;

        positions.set(nodeId, { x, y });

        // Track bounds
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + node.width);
        maxY = Math.max(maxY, y + node.height);
      });

      // Calculate padding based on viewport size to allow centering any step
      // Use viewport dimensions if available, otherwise fallback to reasonable default
      const viewport = this.container.parentElement;
      let padding = 50; // Minimum padding for aesthetics

      if (viewport) {
        // Add at least half the viewport dimensions as padding
        // This ensures any step can be panned to the center
        const viewportPadding = Math.max(viewport.clientWidth / 2, viewport.clientHeight / 2);
        padding = Math.max(padding, viewportPadding);
      }

      // Second pass: position steps with padding offset
      this.graph.nodes().forEach(nodeId => {
        const node = this.graph.node(nodeId);
        const step = node.element;
        const pos = positions.get(nodeId);

        // Shift by padding and normalize to container origin
        const x = pos.x - minX + padding;
        const y = pos.y - minY + padding;

        step.style.position = 'absolute';
        step.style.left = `${x}px`;
        step.style.top = `${y}px`;
      });

      const width = maxX - minX + padding * 2;
      const height = maxY - minY + padding * 2;

      this.container.style.width = `${width}px`;
      this.container.style.height = `${height}px`;
      this.container.style.position = 'relative';

      // Store bounds for later use
      this.bounds = { minX, minY, maxX, maxY, padding };
    }

    _createSvgOverlay(width, height) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('class', 'journey-svg-overlay');

      svg.style.position = 'absolute';
      svg.style.top = '0px';
      svg.style.left = '0px';
      svg.style.pointerEvents = 'none';
      svg.style.zIndex = '10';

      // Create arrowhead marker definition
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');

      marker.setAttribute('id', 'arrowhead');
      marker.setAttribute('markerWidth', '10');
      marker.setAttribute('markerHeight', '10');
      marker.setAttribute('refX', '9');
      marker.setAttribute('refY', '3');
      marker.setAttribute('orient', 'auto');
      marker.setAttribute('markerUnits', 'strokeWidth');

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M0,0 L0,6 L9,3 z');
      path.setAttribute('fill', this.options.arrows.color);

      marker.appendChild(path);
      defs.appendChild(marker);
      svg.appendChild(defs);

      this.container.appendChild(svg);
      this.svgOverlay = svg;
    }

    _drawArrows() {
      // Calculate offset to account for padding added in _positionSteps
      const offsetX = -this.bounds.minX + this.bounds.padding;
      const offsetY = -this.bounds.minY + this.bounds.padding;

      // First pass: draw all arrow paths and collect label data
      const labelData = [];

      this.graph.edges().forEach(edgeObj => {
        const edge = this.graph.edge(edgeObj);

        // Build SVG path from Dagre-computed points, offset by padding
        const pathData = edge.points
          .map((point, i) => {
            const x = point.x + offsetX;
            const y = point.y + offsetY;
            return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
          })
          .join(' ');

        // Create arrow path
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('class', 'journey-arrow');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', this.options.arrows.color);
        path.setAttribute('stroke-width', this.options.arrows.width);

        this.svgOverlay.appendChild(path);

        // Collect label data for collision detection
        if (this.options.arrows.showLabels && edge.label) {
          const bbox = { width: edge.label.length * 7, height: 16 };
          labelData.push({
            edge: edge,
            edgePoints: edge.points,
            label: edge.label,
            bbox: bbox,
            position: 0.5  // Start at midpoint (50%)
          });
        }
      });

      // Second pass: detect collisions and adjust label positions
      if (labelData.length > 0) {
        this._adjustLabelPositions(labelData);

        // Third pass: render labels at adjusted positions
        labelData.forEach(data => {
          const point = this._getPointAlongEdge(data.edgePoints, data.position);
          const midX = point.x + offsetX;
          const midY = point.y + offsetY;

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', midX);
          text.setAttribute('y', midY);
          text.setAttribute('class', 'arrow-label');
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('dominant-baseline', 'middle');
          text.setAttribute('fill', this.options.arrows.color);
          text.setAttribute('font-size', '12px');
          text.setAttribute('font-family', 'system-ui, sans-serif');
          text.textContent = data.label;

          // Add white background for readability
          const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bgRect.setAttribute('x', midX - data.bbox.width / 2 - 4);
          bgRect.setAttribute('y', midY - data.bbox.height / 2 - 2);
          bgRect.setAttribute('width', data.bbox.width + 8);
          bgRect.setAttribute('height', data.bbox.height + 4);
          bgRect.setAttribute('fill', 'white');
          bgRect.setAttribute('stroke', '#ccc');
          bgRect.setAttribute('stroke-width', '1');
          bgRect.setAttribute('rx', '3');

          this.svgOverlay.appendChild(bgRect);
          this.svgOverlay.appendChild(text);
        });
      }
    }

    _getPointAlongEdge(points, position) {
      // Get a point along the edge path at the given position (0.0 to 1.0)
      // position 0.0 = start, 0.5 = midpoint, 1.0 = end

      if (points.length === 0) return { x: 0, y: 0 };
      if (points.length === 1) return points[0];

      // Calculate total path length
      let totalLength = 0;
      const segments = [];
      for (let i = 0; i < points.length - 1; i++) {
        const dx = points[i + 1].x - points[i].x;
        const dy = points[i + 1].y - points[i].y;
        const length = Math.sqrt(dx * dx + dy * dy);
        segments.push({ start: points[i], end: points[i + 1], length: length });
        totalLength += length;
      }

      // Find the segment that contains our target position
      const targetLength = totalLength * position;
      let currentLength = 0;

      for (const segment of segments) {
        if (currentLength + segment.length >= targetLength) {
          // This segment contains our target point
          const segmentPosition = (targetLength - currentLength) / segment.length;
          return {
            x: segment.start.x + (segment.end.x - segment.start.x) * segmentPosition,
            y: segment.start.y + (segment.end.y - segment.start.y) * segmentPosition
          };
        }
        currentLength += segment.length;
      }

      // Fallback: return the last point
      return points[points.length - 1];
    }

    _adjustLabelPositions(labelData) {
      // Detect collisions and adjust label positions along their edge paths
      const maxIterations = 5;
      const adjustmentStep = 0.05;  // Move 5% along the edge path per iteration

      for (let iteration = 0; iteration < maxIterations; iteration++) {
        let hadCollision = false;

        // Check all pairs for collisions
        for (let i = 0; i < labelData.length; i++) {
          for (let j = i + 1; j < labelData.length; j++) {
            const label1 = labelData[i];
            const label2 = labelData[j];

            // Get current positions with offsets
            const offsetX = -this.bounds.minX + this.bounds.padding;
            const offsetY = -this.bounds.minY + this.bounds.padding;

            const point1 = this._getPointAlongEdge(label1.edgePoints, label1.position);
            const point2 = this._getPointAlongEdge(label2.edgePoints, label2.position);

            const x1 = point1.x + offsetX;
            const y1 = point1.y + offsetY;
            const x2 = point2.x + offsetX;
            const y2 = point2.y + offsetY;

            // Check for rectangle overlap (with padding)
            const padding = 4;
            const rect1 = {
              left: x1 - label1.bbox.width / 2 - padding,
              right: x1 + label1.bbox.width / 2 + padding,
              top: y1 - label1.bbox.height / 2 - padding,
              bottom: y1 + label1.bbox.height / 2 + padding
            };

            const rect2 = {
              left: x2 - label2.bbox.width / 2 - padding,
              right: x2 + label2.bbox.width / 2 + padding,
              top: y2 - label2.bbox.height / 2 - padding,
              bottom: y2 + label2.bbox.height / 2 + padding
            };

            if (this._rectanglesOverlap(rect1, rect2)) {
              hadCollision = true;

              // Move labels toward their source (decrease position value)
              // Keep positions between 0.2 and 0.8 to stay on the edge
              label1.position = Math.max(0.2, label1.position - adjustmentStep);
              label2.position = Math.min(0.8, label2.position + adjustmentStep);
            }
          }
        }

        // If no collisions detected, we're done
        if (!hadCollision) break;
      }
    }

    _rectanglesOverlap(rect1, rect2) {
      return rect1.left < rect2.right &&
             rect1.right > rect2.left &&
             rect1.top < rect2.bottom &&
             rect1.bottom > rect2.top;
    }

    _initializePanZoom() {
      const viewport = this.container.parentElement;

      if (!viewport) {
        console.warn('No viewport found for zoom/pan initialization');
        return;
      }

      // Create zoom/pan controller with our options
      this.zoomPanController = new ZoomPanController(this.container, viewport, {
        minScale: this.options.zoom.min,
        maxScale: this.options.zoom.max,
        step: this.options.zoom.step
      });

      // Set cursor style for dragging
      this.container.style.cursor = 'grab';
    }


    _findStartStep() {
      const startStep = this.container.querySelector('[data-place="start"]');

      if (!startStep) {
        console.warn('No start step found with data-place="start", defaulting to first step');
        return this.steps[0];
      }

      return startStep;
    }

    _navigateToStart() {
      // Check for URL fragment first
      const urlFragment = this._getUrlFragment();
      let targetStep = null;

      if (urlFragment) {
        // Try to find step matching the URL fragment
        const fragmentStep = document.getElementById(urlFragment);
        if (fragmentStep && this.steps.includes(fragmentStep)) {
          targetStep = fragmentStep;
        }
      }

      // Fall back to start step if no valid fragment
      if (!targetStep) {
        targetStep = this._findStartStep();
      }

      if (!targetStep || !this.zoomPanController) {
        return;
      }

      const viewport = this.container.parentElement;

      if (!viewport) {
        return;
      }

      // Set initial zoom
      const scale = this.options.zoom.initial;
      this.zoomPanController.zoom(scale, { animate: false });

      // Use offset positions (untransformed coordinates)
      const stepCenterX = targetStep.offsetLeft + targetStep.offsetWidth / 2;
      const stepTopY = targetStep.offsetTop;

      // Calculate target pan to center horizontally and position 20px from top vertically
      const targetX = (viewport.clientWidth / 2) - (stepCenterX * scale);
      const targetY = 20 - (stepTopY * scale);

      // Apply pan
      this.zoomPanController.pan(targetX, targetY, { animate: false });

      // Add highlight to starting step
      targetStep.classList.add('journey-step-current');
    }

    _getUrlFragment() {
      // Get URL fragment without the # prefix
      // Parse format: #step:step-2 → step-2
      // This prevents browser from auto-scrolling to element with matching id
      const hash = window.location.hash;
      if (!hash) return '';

      const hashValue = hash.substring(1);

      // New format: step:step-id
      if (hashValue.startsWith('step:')) {
        return hashValue.substring(5); // Remove 'step:' prefix
      }

      // Backward compatibility: support old format without prefix
      // This allows existing bookmarks to continue working
      return hashValue;
    }

    // Public API methods
    navigateTo(stepId, options = {}) {
      const step = document.getElementById(stepId);

      if (!step) {
        console.warn(`Step not found: ${stepId}`);
        return;
      }

      if (!this.zoomPanController) {
        console.warn('ZoomPanController not initialized');
        return;
      }

      const viewport = this.container.parentElement;

      if (!viewport) {
        return;
      }

      // Set zoom if specified
      if (options.zoom) {
        this.zoomPanController.zoom(options.zoom, { animate: false });
      }

      // Get current scale
      const scale = this.zoomPanController.getScale();

      // Use offset positions (untransformed coordinates)
      const stepCenterX = step.offsetLeft + step.offsetWidth / 2;
      const stepTopY = step.offsetTop;

      // Calculate target pan to center horizontally and position 20px from top vertically
      const targetX = (viewport.clientWidth / 2) - (stepCenterX * scale);
      const targetY = 20 - (stepTopY * scale);

      // Apply animation if requested
      const animate = options.animate !== undefined ? options.animate : true;

      // Apply pan
      this.zoomPanController.pan(targetX, targetY, { animate: animate });

      const previousStep = this.currentStep;
      this.currentStep = stepId;

      // Remove highlight from previous step
      if (previousStep) {
        const prevStepElement = document.getElementById(previousStep);
        if (prevStepElement) {
          prevStepElement.classList.remove('journey-step-current');
        }
      }

      // Add persistent highlight to current step
      step.classList.add('journey-step-current');

      // Add temporary highlight animation if enabled
      if (this.options.navigation.highlightOnNavigate) {
        step.classList.add('journey-step-highlight');
        setTimeout(() => {
          step.classList.remove('journey-step-highlight');
        }, 1000);
      }

      // Update URL fragment with step: prefix
      // This prevents browser from auto-scrolling to element with matching id
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', `#step:${stepId}`);
      } else {
        window.location.hash = `step:${stepId}`;
      }

      // Emit navigate event
      this._emit('navigate', { from: previousStep, to: stepId });
    }

    reset() {
      this._navigateToStart();
    }

    refresh() {
      // Re-measure and re-layout
      this._buildGraph();
      this._computeLayout();
      this._positionSteps();

      // Redraw arrows
      if (this.svgOverlay) {
        this.svgOverlay.innerHTML = '';
        this._createSvgOverlay(
          parseInt(this.container.style.width),
          parseInt(this.container.style.height)
        );
      }
      this._drawArrows();

      this._emit('layout-complete');
    }

    getState() {
      return {
        currentStep: this.currentStep,
        totalSteps: this.steps.length,
        scale: this.zoomPanController ? this.zoomPanController.getScale() : 1,
        pan: this.zoomPanController ? this.zoomPanController.getPan() : { x: 0, y: 0 }
      };
    }

    destroy() {
      if (this.zoomPanController) {
        this.zoomPanController.destroy();
        this.zoomPanController = null;
      }

      if (this.svgOverlay && this.svgOverlay.parentNode) {
        this.svgOverlay.parentNode.removeChild(this.svgOverlay);
      }

      this._emit('destroy');
    }

    // Event system
    on(eventName, callback) {
      if (!this.eventHandlers) {
        this.eventHandlers = {};
      }
      if (!this.eventHandlers[eventName]) {
        this.eventHandlers[eventName] = [];
      }
      this.eventHandlers[eventName].push(callback);
    }

    _emit(eventName, data) {
      if (!this.eventHandlers || !this.eventHandlers[eventName]) {
        return;
      }
      this.eventHandlers[eventName].forEach(callback => callback(data));
    }

    // Main initialization method
    async init() {
      try {
        console.time('journey-init');

        // Wait for fonts and images to load for accurate measurements
        await this._waitForContentReady();

        // Step-by-step initialization
        this._discoverSteps();
        this._buildGraph();
        this._computeLayout();
        this._positionSteps();

        const width = parseInt(this.container.style.width);
        const height = parseInt(this.container.style.height);
        this._createSvgOverlay(width, height);
        this._drawArrows();

        this._initializePanZoom();
        this._setupButtonHandlers();

        // Wait for panzoom to fully initialize before navigating to start
        await new Promise(resolve => setTimeout(resolve, 0));
        this._navigateToStart();

        // Set currentStep based on URL fragment or start step
        const urlFragment = this._getUrlFragment();
        if (urlFragment) {
          const fragmentStep = document.getElementById(urlFragment);
          if (fragmentStep && this.steps.includes(fragmentStep)) {
            this.currentStep = fragmentStep.id;
          } else {
            this.currentStep = this._findStartStep().id;
          }
        } else {
          this.currentStep = this._findStartStep().id;
        }

        console.timeEnd('journey-init');
        this._emit('layout-complete');

        return this;
      } catch (error) {
        console.error('Initialization failed:', error);
        throw error;
      }
    }

    async _waitForContentReady() {
      // Wait for fonts
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      // Wait for images
      const images = Array.from(this.container.querySelectorAll('img'))
        .filter(img => !img.complete);

      if (images.length > 0) {
        await Promise.all(
          images.map(img => new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve; // Continue even if image fails
          }))
        );
      }
    }

    _setupButtonHandlers() {
      const buttons = this.container.querySelectorAll('[data-dest]');

      buttons.forEach(button => {
        button.addEventListener('click', (e) => {
          const destId = button.getAttribute('data-dest');
          if (destId) {
            this.navigateTo(destId, { animate: true });
          }
        });
      });
    }
  }

  exports.JourneyVisualizer = JourneyVisualizer;
  exports.LaneAnalyzer = LaneAnalyzer;
  exports.LaneLayout = LaneLayout;

}));

  </script>

  <script>
    const visualizer = new JourneyVisualizer.JourneyVisualizer('.journey-container');
    visualizer.init();
  </script>
