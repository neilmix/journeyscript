<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Zoom - Journey Visualizer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #debug {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 15px;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 10000;
      border: 2px solid #0f0;
    }
    #debug .log-entry {
      margin: 3px 0;
      padding: 2px 0;
      border-bottom: 1px solid #333;
    }
    #debug .wheel { color: #ff0; }
    #debug .change { color: #0ff; }
    #debug .adjust { color: #f0f; }
  </style>
</head>
<body>
  <div id="debug">
    <div style="color: #fff; font-weight: bold;">Zoom Debug Log</div>
    <div id="log"></div>
  </div>

  <div class="journey-viewport" style="width: 800px; height: 600px; margin: 20px auto;">
    <div class="journey-container">
      <div class="step" id="step1" data-place="start">
        <h3>Start</h3>
        <p>Starting step</p>
      </div>
      <div class="step" id="step2" data-next="step3">
        <h3>Step 2</h3>
        <p>Second step</p>
      </div>
      <div class="step" id="step3">
        <h3>Step 3</h3>
        <p>Final step</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { JourneyVisualizer } from '../dist/journey-visualizer.js';

    const logDiv = document.getElementById('log');
    let logCount = 0;
    const MAX_LOGS = 30;

    function log(message, className = '') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${className}`;
      entry.textContent = `[${logCount++}] ${message}`;
      logDiv.insertBefore(entry, logDiv.firstChild);

      // Keep only last MAX_LOGS entries
      while (logDiv.children.length > MAX_LOGS) {
        logDiv.removeChild(logDiv.lastChild);
      }
    }

    function getTransformInfo() {
      const container = document.querySelector('.journey-container');
      const transform = window.getComputedStyle(container).transform;
      const matrix = transform.match(/matrix\((.+)\)/);
      if (matrix) {
        const values = matrix[1].split(', ').map(v => parseFloat(v));
        return {
          scale: values[0].toFixed(3),
          x: values[4].toFixed(1),
          y: values[5].toFixed(1)
        };
      }
      return { scale: '1.000', x: '0', y: '0' };
    }

    // Initialize visualizer
    const visualizer = new JourneyVisualizer('.journey-container', {
      zoom: {
        initial: 1.0
      }
    });

    await visualizer.init();

    log('Visualizer initialized', 'change');

    // Monitor wheel events
    const viewport = document.querySelector('.journey-viewport');
    viewport.addEventListener('wheel', (e) => {
      const info = getTransformInfo();
      log(`WHEEL: deltaY=${e.deltaY.toFixed(0)} | scale=${info.scale} pan=(${info.x}, ${info.y})`, 'wheel');
    }, true);

    // Monitor panzoom changes
    const container = document.querySelector('.journey-container');
    container.addEventListener('panzoomchange', (e) => {
      if (e.detail) {
        const info = getTransformInfo();
        log(`CHANGE: scale=${e.detail.scale.toFixed(3)} | actual=(${info.scale}, ${info.x}, ${info.y})`, 'change');
      }
    });

    // Try to intercept _adjustPanForZoom if possible
    const originalAdjust = visualizer._adjustPanForZoom;
    if (originalAdjust) {
      visualizer._adjustPanForZoom = function(oldScale, newScale) {
        const before = getTransformInfo();
        log(`ADJUST CALLED: ${oldScale.toFixed(3)} -> ${newScale.toFixed(3)} | before=(${before.scale}, ${before.x}, ${before.y})`, 'adjust');
        originalAdjust.call(this, oldScale, newScale);
        const after = getTransformInfo();
        log(`ADJUST DONE: after=(${after.scale}, ${after.x}, ${after.y})`, 'adjust');
      };
    }

    log('Monitoring started - try scrolling!', 'change');
  </script>
</body>
</html>
