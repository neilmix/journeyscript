<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Label Overlap Test</title>
  <style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

.journey-viewport {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background: #f5f5f5;
}

.journey-container {
  position: relative;
}

.step {
  background: white;
  border: 2px solid #333;
  border-radius: 8px;
  padding: 20px;
  min-width: 200px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.step h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

.step p {
  margin: 0 0 15px 0;
  font-size: 14px;
  color: #666;
}

.step button {
  background: #007bff;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
  font-size: 14px;
}

.step button:hover {
  background: #0056b3;
}

.journey-step-highlight {
  animation: highlight 1s ease-in-out;
}

@keyframes highlight {
  0%, 100% { background: white; }
  50% { background: #fffacd; }
}

.journey-step-current {
  border-color: #007bff !important;
  border-width: 3px !important;
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3), 0 2px 8px rgba(0,0,0,0.1);
}
  </style>
</head>
<body>
  <div class="journey-viewport">
    <div class="journey-container">
      <!-- Parent node with multiple children that will point back -->
      <div class="step" id="parent-node" data-place="start">
        <h2>Parent Node</h2>
        <p>This node has multiple children that point back to it with long button labels.</p>
        <p>
          <button data-dest="child-1">Navigate to First Child</button>
          <button data-dest="child-2">Navigate to Second Child</button>
          <button data-dest="child-3">Navigate to Third Child</button>
        </p>
      </div>

      <!-- Child 1 - points back to parent with long label -->
      <div class="step" id="child-1">
        <h2>First Child Node</h2>
        <p>Child with a long return button.</p>
        <p>
          <button data-dest="parent-node">Return to Parent Node from First Child</button>
          <button data-dest="child-2">Go to Second Child</button>
        </p>
      </div>

      <!-- Child 2 - points back to parent with long label -->
      <div class="step" id="child-2">
        <h2>Second Child Node</h2>
        <p>Another child with a long return button.</p>
        <p>
          <button data-dest="parent-node">Return to Parent Node from Second Child</button>
          <button data-dest="child-3">Go to Third Child</button>
        </p>
      </div>

      <!-- Child 3 - points back to parent with long label -->
      <div class="step" id="child-3">
        <h2>Third Child Node</h2>
        <p>Third child with a long return button.</p>
        <p>
          <button data-dest="parent-node">Return to Parent Node from Third Child</button>
          <button data-dest="child-1">Go to First Child</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Load dependencies from CDN -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>

  <!-- Load the built library (UMD version for browser) -->
  <script src="../dist/journey-visualizer.umd.js"></script>

  <script>
    const visualizer = new JourneyVisualizer.JourneyVisualizer('.journey-container');
    visualizer.init();
  </script>
</body>
</html>
